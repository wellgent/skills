# The check command on every pull request and on main. Copied to .github/workflows/check.yml by
# setup-web-stack; the node version comes from the repo's own pin, pnpm from the packageManager field.
name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
        env:
          # Build-time values the production build reads, as repository secrets.
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
